    <!-- Small star sparkles -->
    <circle cx="-120" cy="-40" r="2" fill="#ffffff"/>
    <circle cx="-80" cy="80" r="3" fill="#c4b5fd"/>
    <circle cx="-160" cy="40" r="2.5" fill="#ffffff"/>
  </g>
  <text x="40" y="70" font-family="sans-serif" font-weight="900" font-size="32" fill="#ffffff">HOSTEL DIARIES</text>
  <text x="40" y="100" font-family="sans-serif" font-weight="700" font-size="16" fill="#ddd6fe">RJ KABIR • LATE NIGHT 10:30 PM</text>
