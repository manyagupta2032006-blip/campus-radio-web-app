<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="60%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- Equalizer Sliders & Wave -->
  <g transform="translate(300, 240)">
    <circle r="120" fill="#18181b" stroke="#f59e0b" stroke-width="4"/>
    <line x1="-50" y1="-50" x2="-50" y2="50" stroke="#78350f" stroke-width="6"/>
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#78350f" stroke-width="6"/>
    <line x1="50" y1="-50" x2="50" y2="50" stroke="#78350f" stroke-width="6"/>
    <rect x="-60" y="-10" width="20" height="14" rx="4" fill="#fbbf24"/>
    <rect x="-10" y="15" width="20" height="14" rx="4" fill="#fbbf24"/>
    <rect x="40" y="-30" width="20" height="14" rx="4" fill="#fbbf24"/>
  </g>
  <text x="300" y="440" font-family="sans-serif" font-weight="900" font-size="32" fill="#ffffff" text-anchor="middle">SOUND &amp; BEATS LAB</text>
  <text x="300" y="480" font-family="sans-serif" font-weight="700" font-size="18" fill="#fde68a" text-anchor="middle">PCTE MUSIC SOCIETY</text>
